apiVersion: apps/v1
kind: Deployment
metadata:
  name: workforce-api
  namespace: workforce-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workforce-api
  template:
    metadata:
      labels:
        app: workforce-api
    spec:
      containers:
        - name: api
          image: ghcr.io/gaurishagarg28/enterprise_workforce_intelligence:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: workforce-secrets
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: workforce-api
  namespace: workforce-ai
spec:
  selector:
    app: workforce-api
  ports:
    - port: 8000
      targetPort: 8000
